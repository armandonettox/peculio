# Nome fixo: sem ele o Compose usaria o nome da pasta, e renomear a pasta criaria volumes novos
name: peculio

# Banco descartavel so para os testes do backend (porta 5433, dados em memoria)
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_test"]
      interval: 2s
      timeout: 3s
      retries: 15
