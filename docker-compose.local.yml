# Banco de dados para o desenvolvimento local e para o CI (e2e). NAO vai para a VPS: o deploy envia so o
# docker-compose.yml e a pasta deploy/, e la o banco e o PostgreSQL compartilhado do infra-deck.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# (o frontend/e2e/run.mjs ja inclui os dois arquivos). O nome nao e `docker-compose.override.yml` de proposito:
# esse nome esta no .gitignore (ajustes pessoais) e o CI precisa deste arquivo versionado.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # service_started e nao service_healthy: no podman rootless, quando o compose sobe pela unit
    # do systemd, as checagens de saude nunca chegam a rodar (erro visto: "unable to get systemd
    # connection to remove healthchecks") e o backend ficaria esperando o db para sempre. O
    # entrypoint roda o alembic antes de subir a API; se o banco ainda nao aceitar conexao, o
    # container reinicia sozinho (restart: unless-stopped) ate conseguir.
    depends_on:
      db:
        condition: service_started

volumes:
  db_data:
