<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pecúlio - fora do ar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F8F9FA;
        color: #171717;
        font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        color: #1E3A6B;
      }
      p {
        margin: 0.4rem 0;
        color: #6B7280;
      }
      a {
        color: #00A878;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111111;
          color: #F1F5F9;
        }
        h1 {
          color: #F1F5F9;
        }
        p {
          color: #94A3B8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pecúlio</h1>
      <p>O serviço está temporariamente indisponível.</p>
      <p>Isso costuma durar poucos minutos. <a href="/">Tentar novamente</a></p>
    </main>
  </body>
</html>
