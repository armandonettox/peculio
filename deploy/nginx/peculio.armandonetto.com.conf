# Reverse proxy de peculio.armandonetto.com
#
# O nginx do host recebe o trafego do Cloudflare e entrega ao container do frontend
# (127.0.0.1:8035), que serve o React e faz proxy de /api para o backend. O deploy
# (.github/workflows/deploy.yml) copia este arquivo para /etc/nginx/conf.d/ da VM.
#
# SSL: reaproveita o Origin Certificate do hera, que e wildcard (*.armandonetto.com, valido
# ate 2041) e ja esta em /etc/ssl/cloudflare/ (nao versionado). Modo Full Strict no Cloudflare.
# O peculio depende desse arquivo: nao apague nem renomeie o certificado do hera.
#
# Authenticated Origin Pulls: a CA em origin_pull_ca.pem e a mesma ja usada pelo hera,
# entao so conexoes vindas do Cloudflare sao aceitas.
#
# Os cabecalhos de seguranca (CSP e outros) sao enviados pelo nginx do container do
# frontend (frontend/security-headers.conf). Aqui fica so o HSTS, para nao duplicar cabecalhos.

server {
    listen 80;
    server_name peculio.armandonetto.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name peculio.armandonetto.com;

    ssl_certificate     /etc/ssl/cloudflare/hera.armandonetto.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/hera.armandonetto.com.key;

    ssl_client_certificate /etc/ssl/cloudflare/origin_pull_ca.pem;
    ssl_verify_client on;

    # Anexos de lancamentos: o limite do backend (ATTACHMENT_MAX_BYTES) e 10 MiB por padrao
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Pagina de erro quando o frontend esta fora do ar mas este nginx continua de pe
    error_page 502 503 504 /erro-50x.html;
    location = /erro-50x.html {
        root /usr/share/nginx/peculio-erros;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8035;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # O Cloudflare manda o IP do visitante em CF-Connecting-IP. O container usa o
        # X-Real-IP para limitar pedidos por IP, entao sem isso todos dividiriam o mesmo limite.
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
