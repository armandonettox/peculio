# Cabecalhos de seguranca. Incluido em cada location porque o add_header de um location apaga
# os do nivel acima: sem repetir, as paginas com Cache-Control perderiam todos estes.
#
# Scripts so do proprio endereco. Os estilos aceitam 'unsafe-inline' (decisao do projeto): as telas
# usam style do React e bibliotecas que injetam <style>, e o risco que a politica fecha de verdade
# e o do script.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
