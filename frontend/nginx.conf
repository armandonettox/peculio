server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Chamadas da API vao para o container do backend
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
