# Nome fixo: sem ele o Compose usaria o nome da pasta, e renomear a pasta criaria volumes novos
name: peculio

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Local (docker): sobe a imagem construida por `build`. Na VPS (podman-compose, deploy): a
    # imagem vem do GHCR (PECULIO_BACKEND_IMAGE, definida em ~/peculio/.env.imagens pelo deploy)
    # e o `--no-build` do systemd ignora `build`. Ver deploy/README.md.
    image: ${PECULIO_BACKEND_IMAGE:-peculio-backend:local}
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no .env}
      # O backend so e alcancado pelo Nginx (a porta 8000 nao e publicada). Sem isto, todo
      # mundo chega com o IP do Nginx e a instancia inteira divide o mesmo limite de login.
      TRUST_PROXY_HEADERS: "true"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Cookie de "Manter conectado" so viaja por HTTPS. Ligar (true) quando o Pecúlio estiver atras de HTTPS;
      # com false o cookie tambem funciona em http://localhost
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Define "hoje" para recorrentes, orcamentos e contas a pagar
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      # Libera webhooks para IP privado e http (padrao: so https para enderecos publicos)
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
      # De quantos em quantos segundos o app tenta entregar os webhooks pendentes
      WEBHOOK_INTERVAL_SECONDS: ${WEBHOOK_INTERVAL_SECONDS:-30}
      # Anexos dos lancamentos ficam no volume attachments_data
      ATTACHMENTS_DIR: /data/attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
    volumes:
      - attachments_data:/data/attachments
    # host.docker.internal: o Docker Desktop (Windows/Mac) ja resolve sozinho; no Linux (CI do
    # GitHub Actions, VPS) precisa deste mapeamento explicito. Usado pelo e2e de webhooks, que
    # sobe um receptor na maquina do executor e o container do backend precisa alcanca-lo.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    image: ${PECULIO_FRONTEND_IMAGE:-peculio-frontend:local}
    build: ./frontend
    environment:
      # Nome do servico de backend. Na VPS (podman-compose) os containers do mesmo pod nao
      # compartilham rede: o nginx do frontend resolve esse nome a cada requisicao (ver
      # frontend/nginx.conf.template), entao o nome continua certo mesmo quando o backend
      # reinicia e troca de IP.
      BACKEND_URL: ${PECULIO_BACKEND_URL:-http://backend:8000}
    ports:
      # So o host acessa (localhost local, ou o nginx do host na VPS); nunca exposto direto
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  attachments_data:
